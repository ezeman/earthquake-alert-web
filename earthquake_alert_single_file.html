<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>แผ่นดินไหวล่าสุดใกล้ฉัน</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      font: 14px/1.4 sans-serif;
      max-width: 260px;
    }

    .info-box .error {
      color: #c00;
    }

    .legend-swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border-radius: 50%;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const fallbackLat = 18.7883;  // พิกัดเชียงใหม่
    const fallbackLon = 98.9853;
    const searchRadiusKm = 1000;
    const refreshIntervalMs = 5 * 60 * 1000;  // ดึงข้อมูลใหม่ทุก 5 นาที

    const map = L.map('map').setView([fallbackLat, fallbackLon], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const userLayer = L.layerGroup().addTo(map);
    const quakeLayer = L.layerGroup().addTo(map);

    // กล่องแสดงสถานะ (แทน alert)
    const status = L.control({ position: 'topright' });
    status.onAdd = function () {
      this._div = L.DomUtil.create('div', 'info-box');
      return this._div;
    };
    status.update = function (html, isError) {
      this._div.innerHTML = isError ? `<span class="error">${html}</span>` : html;
    };
    status.addTo(map);

    // คำอธิบายวงรัศมี
    const radii = [
      { km: 100, color: '#ffa500', fillColor: '#ffdead', fillOpacity: 0.3 },
      { km: 300, color: '#99ccff', fillColor: '#cce6ff', fillOpacity: 0.2 },
      { km: 500, color: '#00ccff', fillColor: '#cce5ff', fillOpacity: 0.1 }
    ];
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'info-box');
      div.innerHTML = radii.map(r =>
        `<span class="legend-swatch" style="background:${r.fillColor};border:2px solid ${r.color}"></span>รัศมี ${r.km} กม.`
      ).join('<br>');
      return div;
    };
    legend.addTo(map);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function getColor(magnitude) {
      return magnitude > 6 ? '#ff0000' :
             magnitude > 4 ? '#ff6600' :
             magnitude > 2 ? '#ffcc00' :
                             '#00ff00';
    }

    function drawUser(lat, lon) {
      userLayer.clearLayers();
      // วาดจากวงใหญ่ไปเล็ก และปิดการคลิก เพื่อไม่ให้วงบังกัน
      [...radii].reverse().forEach(r => {
        L.circle([lat, lon], {
          radius: r.km * 1000,
          color: r.color,
          fillColor: r.fillColor,
          fillOpacity: r.fillOpacity,
          interactive: false
        }).addTo(userLayer);
      });
      L.marker([lat, lon]).addTo(userLayer).bindPopup("คุณอยู่ที่นี่");
    }

    function fetchNearbyQuakes(lat, lon, isRefresh) {
      const start = new Date();
      start.setDate(start.getDate() - 7);

      // ไม่ส่ง endtime เพื่อให้ได้ข้อมูลถึงปัจจุบัน (รวมเหตุการณ์ของวันนี้)
      const url = `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&orderby=time&limit=1` +
        `&starttime=${start.toISOString()}&latitude=${lat}&longitude=${lon}&maxradiuskm=${searchRadiusKm}`;

      if (!isRefresh) status.update('กำลังโหลดข้อมูลแผ่นดินไหว...');

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`USGS ตอบกลับ HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          const updated = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;
          quakeLayer.clearLayers();

          if (!data.features || data.features.length === 0) {
            if (!isRefresh) map.setView([lat, lon], 5);
            status.update(`ไม่พบแผ่นดินไหวในรัศมี ${searchRadiusKm} กม. ในช่วง 7 วัน<br><small>${updated}</small>`);
            return;
          }

          const quake = data.features[0];
          const [lng, latQ, depth] = quake.geometry.coordinates;
          const { mag, place, time } = quake.properties;
          const magValue = typeof mag === 'number' ? mag : null;
          const distanceKm = Math.round(map.distance([lat, lon], [latQ, lng]) / 1000);

          L.circleMarker([latQ, lng], {
            radius: Math.max(magValue ?? 0, 1) * 3,
            fillColor: getColor(magValue ?? 0),
            color: '#000',
            weight: 1,
            fillOpacity: 0.8
          })
          .addTo(quakeLayer)
          .bindPopup(`<h3>แผ่นดินไหวใกล้คุณ</h3>
            <strong>สถานที่:</strong> ${escapeHtml(place ?? 'ไม่ทราบ')}<br>
            <strong>ขนาด:</strong> ${magValue ?? 'ไม่ทราบ'}<br>
            <strong>ลึก:</strong> ${depth} กม.<br>
            <strong>ระยะห่างจากคุณ:</strong> ${distanceKm.toLocaleString('th-TH')} กม.<br>
            <strong>เวลา:</strong> ${new Date(time).toLocaleString('th-TH')}`);

          if (!isRefresh) {
            // ให้เห็นทั้งตำแหน่งผู้ใช้และจุดเกิดเหตุ แล้วค่อยเปิด popup เมื่อแผนที่เลื่อนเสร็จ
            map.once('moveend', () => quakeLayer.eachLayer(l => l.openPopup()));
            map.fitBounds(L.latLngBounds([[lat, lon], [latQ, lng]]), { padding: [60, 60], maxZoom: 7 });
          }
          status.update(`แผ่นดินไหวล่าสุดห่าง ${distanceKm.toLocaleString('th-TH')} กม.<br><small>${updated}</small>`);
        })
        .catch(err => {
          console.error(err);
          status.update('ไม่สามารถโหลดข้อมูลแผ่นดินไหวได้', true);
        });
    }

    let started = false;

    function start(lat, lon) {
      if (started) return;
      started = true;
      drawUser(lat, lon);
      fetchNearbyQuakes(lat, lon, false);
      setInterval(() => fetchNearbyQuakes(lat, lon, true), refreshIntervalMs);
    }

    function init() {
      if (navigator.geolocation) {
        status.update('กำลังขอตำแหน่งของคุณ...');
        // timeout ของ geolocation ไม่นับช่วงที่ผู้ใช้ยังไม่ตอบคำขอสิทธิ์ จึงตั้งตัวสำรองเอง
        setTimeout(() => {
          if (!started) {
            console.warn("ไม่ได้รับตำแหน่ง ใช้พิกัดสำรอง: เชียงใหม่");
            start(fallbackLat, fallbackLon);
          }
        }, 15000);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            start(latitude, longitude);
          },
          (err) => {
            console.warn("ใช้พิกัดสำรอง: เชียงใหม่", err);
            start(fallbackLat, fallbackLon);
          },
          { timeout: 10000, maximumAge: 5 * 60 * 1000 }
        );
      } else {
        console.warn("เบราว์เซอร์ไม่รองรับ Geolocation, ใช้เชียงใหม่แทน");
        start(fallbackLat, fallbackLon);
      }
    }

    init();
  </script>
</body>
</html>
